# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon. 4 GB keeps R8 / Kotlin compilation comfortable
# on CI runners and typical developer machines.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Build speed
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache works with this setup but is left off so a first build cannot fail
# on an unrelated plugin incompatibility. Turn it on for faster incremental builds:
# org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
